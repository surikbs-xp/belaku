services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: "9000"
      DB_PATH: /data/paper_trading.db
      LOG_FILE: /data/bot.log
      # Keep the NSE holiday cache on the writable volume: the image is
      # read_only, so the in-package default path cannot be written.
      HOLIDAY_CACHE_PATH: /data/nse_holidays.json
    # No `user:` here on purpose. The image's entrypoint repairs the ownership of
    # a /data volume left root-owned by an older image, then drops privileges to
    # uid 10001 with setpriv — so the bot process is never root, but an existing
    # deployment does not have to delete its trading database to upgrade.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - bot-data:/data
      - ./bot/.env:/app/bot/.env
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  bot-data:
