<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Belaku · Sign in</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <!-- Versioned like index.html: without it a browser keeps the previous
         stylesheet and a CSS change needs a hard refresh to appear. -->
    <link rel="stylesheet" href="/static/styles.css?v=trader-42" />
  </head>
  <body class="login-body">
    <!-- A single centred card. The left pane that used to list the strategies is
         gone: a login page is not the place to publish what the bot trades, and
         the list was the first thing on screen for anyone who reached the URL. -->
    <main class="login-shell">
      <!-- The mark is drawn, not a letter in a box: a ring with a rising line
           through it, which reads as a chart without being one. -->
      <div class="login-emblem" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64" role="presentation">
          <defs>
            <linearGradient id="lg" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#22c55e" />
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="30" fill="none" stroke="url(#lg)"
                  stroke-width="1.5" opacity="0.55" />
          <circle cx="32" cy="32" r="23" fill="none" stroke="url(#lg)"
                  stroke-width="1" opacity="0.22" />
          <path d="M17 40 L26 31 L33 37 L47 22" fill="none" stroke="url(#lg)"
                stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="47" cy="22" r="3.1" fill="#22c55e" />
        </svg>
      </div>

      <h1 class="login-title">Belaku</h1>
      <p class="login-subtitle">Sign in to the trading console</p>

      <form id="login-form" autocomplete="on" novalidate>
        <div class="login-field">
          <label for="password">Password</label>
          <div class="login-input-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              spellcheck="false"
              autocapitalize="off"
              required
              autofocus
              aria-describedby="login-error"
            />
            <!-- Reveal toggle: a long password typed blind on a phone is the
                 most common reason a correct one is rejected. -->
            <button
              type="button"
              id="login-reveal"
              class="login-reveal"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linejoin="round"
                />
                <circle cx="12" cy="12" r="2.6" fill="none"
                        stroke="currentColor" stroke-width="1.7" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit" class="login-submit">
          <span id="login-submit-label">Sign in</span>
        </button>

        <p id="login-error" class="login-error" role="alert" hidden></p>
      </form>

      <!-- Live status, read from the unauthenticated health endpoint. It says
           only whether the process is up and how long it has been up - no
           positions, no P&L, nothing that needs a session. -->
      <p class="login-status" id="login-status" data-state="unknown">
        <span class="login-status-dot" aria-hidden="true"></span>
        <span id="login-status-text">Checking the bot…</span>
      </p>
    </main>

    <script src="/static/login.js?v=trader-42"></script>
  </body>
</html>
