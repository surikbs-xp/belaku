name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Only the clone is needed at workflow scope; `pages` and `id-token` are granted
# to the deploy job alone, so a compromised build step cannot publish.
permissions:
  contents: read

# Let an in-flight deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted, not self-hosted. A self-hosted runner runs on whatever
    # machine you registered, so a docs build would be tied to the trading box
    # being awake — and `deploy-pages` needs `pages: write` plus an OIDC token,
    # which the default GITHUB_TOKEN only gets on GitHub-hosted runners for
    # public repositories. Pin node to the version the site builds on.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `enablement: true` lets a first run turn Pages on instead of failing
      # with "Get Pages site failed". It needs a token with `pages: write`
      # (the default GITHUB_TOKEN on a public repo is enough).
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
