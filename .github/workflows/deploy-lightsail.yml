name: Deploy to Lightsail

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'EXECUTION_MODE for this deployment'
        type: choice
        options: [PAPER, LIVE]
        default: PAPER

# A deploy replaces the running container, so two in flight at once would race
# for the same service. Queue one behind the other rather than cancelling: a
# cancelled deploy can leave the service on a half-rolled-out image.
concurrency:
  group: lightsail-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC role assumption; unused when falling back to access keys

env:
  # The organization's service control policy denies Lightsail container
  # actions in most regions, ap-south-1 (Mumbai) included. ap-southeast-2 is
  # one of the few where CreateContainerService and the registry/deploy calls
  # are permitted, so the service lives there.
  AWS_REGION: ap-southeast-2
  SERVICE_NAME: belaku
  CONTAINER_NAME: bot
  CONTAINER_PORT: '9000'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      # The test job needs the dev tooling; the image does not. requirements-dev
      # includes the runtime file, so this installs both.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q bot tests

      - name: Test
        run: python -m pytest -q

  # Decides whether there is anything to deploy *before* the deploy job runs.
  #
  # A job-level `if:` cannot read `secrets`, so the check has to be a step, and a
  # step that fails cannot stop a job that has already started. This job publishes
  # the answer as an output the deploy job gates on instead.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether deploy credentials exist
        id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "OIDC role configured: $AWS_ROLE_ARN"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Access-key pair configured"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$AWS_ACCESS_KEY_ID" ] || [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            # One half of the pair set is a mistake, not an absent integration:
            # it must be reported rather than silently skipped.
            echo "::error::Only one of AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY is set. Set both, or neither (and use AWS_ROLE_ARN for OIDC). See website/docs/lightsail.md."
            exit 1
          else
            echo "No AWS credentials configured; the deploy will be skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, preflight]
    # A repository that has never set an AWS secret used to go red on every push
    # with "Could not load credentials from any providers" - a failure unrelated
    # to the code. The bot also runs from `docker compose up` and
    # `deploy/belaku.service`, so an un-deployed repository is a valid state. A
    # manual run always deploys, so an operator asking for it is never silently
    # skipped.
    if: >-
      needs.preflight.outputs.configured == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: lightsail
      url: ${{ steps.deploy.outputs.url }}
    env:
      # Set AWS_ROLE_ARN to use GitHub OIDC and skip the long-lived keys
      # entirely. Empty means the access-key secrets are used instead.
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v6

      # The Lightsail CLI plugin is what lets `push-container-image` read the
      # local Docker daemon. Without it the push fails with "exec: lightsailctl:
      # executable file not found in $PATH".
      - name: Install lightsailctl
        run: |
          curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" \
            -o /usr/local/bin/lightsailctl
          chmod +x /usr/local/bin/lightsailctl

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fallback for accounts without a GitHub OIDC provider. Long-lived keys are
      # the weaker option; prefer AWS_ROLE_ARN and delete the key secrets.
      - name: Configure AWS credentials (access keys)
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build image
        run: |
          IMAGE="belaku:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Secrets are written to a file rather than passed as --build-arg or
      # inline env so they never appear in the build log or the image layers.
      - name: Write runtime environment
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET: ${{ secrets.KITE_TOTP_SECRET }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          # ALERT_ENABLED was documented as a secret but never passed, so setting
          # it did nothing: the container kept the .env default of 0 and stayed
          # silent however the secret was set.
          ALERT_ENABLED: ${{ secrets.ALERT_ENABLED }}
          ALERT_CHANNEL: ${{ secrets.ALERT_CHANNEL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          EXECUTION_MODE: ${{ inputs.execution_mode || 'PAPER' }}
        run: |
          umask 077
          ENV_FILE="$RUNNER_TEMP/belaku.env"
          : > "$ENV_FILE"
          for name in KITE_API_KEY KITE_API_SECRET KITE_ACCESS_TOKEN \
                      KITE_USER_ID KITE_PASSWORD KITE_TOTP_SECRET \
                      DASHBOARD_PASSWORD DASHBOARD_SESSION_SECRET \
                      ALERT_ENABLED ALERT_CHANNEL ALERT_WEBHOOK_URL \
                      ALERT_TELEGRAM_BOT_TOKEN ALERT_TELEGRAM_CHAT_ID \
                      EXECUTION_MODE; do
            value="$(printenv "$name" || true)"
            # Skip unset secrets instead of writing "KEY=" and overriding the
            # script's defaults with an empty string.
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$ENV_FILE"
            fi
          done
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

      - name: Build deployment spec
        run: |
          python3 deploy/lightsail/build-spec.py \
            --service-name "$SERVICE_NAME" \
            --image "$IMAGE" \
            --container-name "$CONTAINER_NAME" \
            --container-port "$CONTAINER_PORT" \
            --env-file "$ENV_FILE" \
            --out "$RUNNER_TEMP/spec.json"

      - name: Push and deploy
        id: deploy
        run: |
          python3 deploy/lightsail/deploy.py \
            --service-name "$SERVICE_NAME" \
            --region "$AWS_REGION" \
            --image "$IMAGE" \
            --label "$CONTAINER_NAME" \
            --spec "$RUNNER_TEMP/spec.json" \
            --power micro \
            --scale 1
          URL="$(aws lightsail get-container-services \
            --service-name "$SERVICE_NAME" --region "$AWS_REGION" \
            --query 'containerServices[0].url' --output text)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Container logs on failure
        if: failure()
        run: |
          aws lightsail get-container-log \
            --service-name "$SERVICE_NAME" \
            --container-name "$CONTAINER_NAME" \
            --region "$AWS_REGION" \
            --output text | tail -n 200 || true
